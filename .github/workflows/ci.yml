name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        toolchain: ['1.89.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component rustfmt --component clippy
          rustup override set '${{ matrix.toolchain }}'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked

  assets-and-policy:
    name: Desktop assets and authorization policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install asset validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils libxml2-utils
      - run: node --test tests/polkit.test.cjs
      - run: desktop-file-validate plex-tray.desktop
      - run: xmllint --noout icons/*.svg
      - run: bash -n PKGBUILD
